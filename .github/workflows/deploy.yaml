name: Deploy site

# Builds the site and publishes it on the github-pages branch, which GitHub
# Pages serves on millipuce.fr.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache optimised images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('images/**', 'config.yaml') }}
          restore-keys: astro-images-
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: github-pages
          publish_dir: ./dist
          cname: millipuce.fr
          commit_message: deploy
